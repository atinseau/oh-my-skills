pre-commit:
  jobs:
    - run: bun check-types
    - run: bun biome check --write {staged_files} --no-errors-on-unmatched --unsafe
      stage_fixed: true
    - run: bash -n scripts/install.sh && bash -n scripts/uninstall.sh && bash -n scripts/update.sh && bash -n scripts/hooks.sh
    - group:
        parallel: true
        jobs:
          # `bun run test` (not `bun test`) so pretest builds the shared image.
          # Never use --changed here: it follows the JS import graph, and the
          # suite's real inputs are the shell scripts it docker-cp's in, so a
          # change to scripts/*.sh selects zero tests.
          - run: bun run test
            interactive: true
